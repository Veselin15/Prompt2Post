services:
  postgres:
    image: postgres:16-alpine
    container_name: prompt2post-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: prompt2post
      POSTGRES_PASSWORD: prompt2post
      POSTGRES_DB: prompt2post
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompt2post -d prompt2post"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
